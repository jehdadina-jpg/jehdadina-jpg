<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 78" width="860" height="78"
     role="img" aria-label="Featured Projects">
  <title>Featured Projects</title>
  <defs>
    <linearGradient id="bg-projects" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFB800" stop-opacity="0.2"/>
      <stop offset="55%"  stop-color="#050a07" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#050a07" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule-projects" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFB800"/>
      <stop offset="60%"  stop-color="#FFB800" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFB800" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="badge-projects" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFB800" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFB800" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="soft-projects" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t-projects { font-family:"Segoe UI",Inter,Helvetica,Arial,sans-serif;
                   font-size:27px; font-weight:800; fill:#ffffff; letter-spacing:-0.2px; }
      .k-projects { font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
                   font-size:11px; font-weight:600; fill:#FFB800;
                   fill-opacity:0.85; letter-spacing:2px; }
    </style>
  </defs>

  <rect width="860" height="78" fill="url(#bg-projects)"/>

  <!-- Accent Rule -->
  <rect x="0" y="74" width="860" height="2" fill="url(#rule-projects)"/>

  <!-- Glyph Box -->
  <rect x="18" y="16" width="44" height="44" rx="10" fill="url(#badge-projects)"
        stroke="#FFB800" stroke-opacity="0.5" stroke-width="1.2"/>
  <g transform="translate(28 26)" color="#FFB800" filter="url(#soft-projects)">
    <rect x="2.6" y="2.6" width="8.2" height="8.2" rx="1.8" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13.2" y="2.6" width="8.2" height="8.2" rx="1.8" fill="currentColor" opacity="0.85"/><rect x="2.6" y="13.2" width="8.2" height="8.2" rx="1.8" fill="currentColor" opacity="0.85"/><rect x="13.2" y="13.2" width="8.2" height="8.2" rx="1.8" fill="none" stroke="currentColor" stroke-width="2"/>
  </g>

  <!-- Titles -->
  <text x="76" y="38" class="k-projects">THINGS THAT ACTUALLY RUN</text>
  <text x="76" y="62" class="t-projects">Featured Projects</text>
</svg>
