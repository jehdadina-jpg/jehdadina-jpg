<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 78" width="860" height="78"
     role="img" aria-label="Quantum Computing">
  <title>Quantum Computing</title>
  <defs>
    <linearGradient id="bg-quantum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#39FF14" stop-opacity="0.2"/>
      <stop offset="55%"  stop-color="#050a07" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#050a07" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule-quantum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#39FF14"/>
      <stop offset="60%"  stop-color="#39FF14" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="badge-quantum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#39FF14" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="soft-quantum" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t-quantum { font-family:"Segoe UI",Inter,Helvetica,Arial,sans-serif;
                   font-size:27px; font-weight:800; fill:#ffffff; letter-spacing:-0.2px; }
      .k-quantum { font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
                   font-size:11px; font-weight:600; fill:#39FF14;
                   fill-opacity:0.85; letter-spacing:2px; }
    </style>
  </defs>

  <rect width="860" height="78" fill="url(#bg-quantum)"/>

  <!-- Accent Rule -->
  <rect x="0" y="74" width="860" height="2" fill="url(#rule-quantum)"/>

  <!-- Glyph Box -->
  <rect x="18" y="16" width="44" height="44" rx="10" fill="url(#badge-quantum)"
        stroke="#39FF14" stroke-opacity="0.5" stroke-width="1.2"/>
  <g transform="translate(28 26)" color="#39FF14" filter="url(#soft-quantum)">
    <circle cx="12" cy="12" r="2.6" fill="currentColor"/><ellipse cx="12" cy="12" rx="10.4" ry="4.4" fill="none" stroke="currentColor" stroke-width="1.8"/><ellipse cx="12" cy="12" rx="10.4" ry="4.4" fill="none" stroke="currentColor" stroke-width="1.8" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10.4" ry="4.4" fill="none" stroke="currentColor" stroke-width="1.8" transform="rotate(120 12 12)"/>
  </g>

  <!-- Titles -->
  <text x="76" y="38" class="k-quantum">SHIPPED, DEPLOYED, PUBLICLY USABLE</text>
  <text x="76" y="62" class="t-quantum">Quantum Computing</text>
</svg>
