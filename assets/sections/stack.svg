<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 78" width="860" height="78"
     role="img" aria-label="Tech Stack">
  <title>Tech Stack</title>
  <defs>
    <linearGradient id="bg-stack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00F0FF" stop-opacity="0.2"/>
      <stop offset="55%"  stop-color="#050a07" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#050a07" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule-stack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00F0FF"/>
      <stop offset="60%"  stop-color="#00F0FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="badge-stack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#00F0FF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="soft-stack" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t-stack { font-family:"Segoe UI",Inter,Helvetica,Arial,sans-serif;
                   font-size:27px; font-weight:800; fill:#ffffff; letter-spacing:-0.2px; }
      .k-stack { font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
                   font-size:11px; font-weight:600; fill:#00F0FF;
                   fill-opacity:0.85; letter-spacing:2px; }
    </style>
  </defs>

  <rect width="860" height="78" fill="url(#bg-stack)"/>

  <!-- Accent Rule -->
  <rect x="0" y="74" width="860" height="2" fill="url(#rule-stack)"/>

  <!-- Glyph Box -->
  <rect x="18" y="16" width="44" height="44" rx="10" fill="url(#badge-stack)"
        stroke="#00F0FF" stroke-opacity="0.5" stroke-width="1.2"/>
  <g transform="translate(28 26)" color="#00F0FF" filter="url(#soft-stack)">
    <path d="M12 2.6 22 8l-10 5.4L2 8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M2 13.2 12 18.6l10-5.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M2 18.2 12 23.6l10-5.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" opacity="0.55"/>
  </g>

  <!-- Titles -->
  <text x="76" y="38" class="k-stack">LANGUAGES, FRAMEWORKS, INFRASTRUCTURE</text>
  <text x="76" y="62" class="t-stack">Tech Stack</text>
</svg>
