<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 78" width="860" height="78"
     role="img" aria-label="About Me">
  <title>About Me</title>
  <defs>
    <linearGradient id="bg-about" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00FF66" stop-opacity="0.2"/>
      <stop offset="55%"  stop-color="#050a07" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#050a07" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule-about" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00FF66"/>
      <stop offset="60%"  stop-color="#00FF66" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="badge-about" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#00FF66" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="soft-about" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t-about { font-family:"Segoe UI",Inter,Helvetica,Arial,sans-serif;
                   font-size:27px; font-weight:800; fill:#ffffff; letter-spacing:-0.2px; }
      .k-about { font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
                   font-size:11px; font-weight:600; fill:#00FF66;
                   fill-opacity:0.85; letter-spacing:2px; }
    </style>
  </defs>

  <rect width="860" height="78" fill="url(#bg-about)"/>

  <!-- Accent Rule -->
  <rect x="0" y="74" width="860" height="2" fill="url(#rule-about)"/>

  <!-- Glyph Box -->
  <rect x="18" y="16" width="44" height="44" rx="10" fill="url(#badge-about)"
        stroke="#00FF66" stroke-opacity="0.5" stroke-width="1.2"/>
  <g transform="translate(28 26)" color="#00FF66" filter="url(#soft-about)">
    <circle cx="12" cy="8.5" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4.2 20.5c0-4.3 3.5-6.6 7.8-6.6s7.8 2.3 7.8 6.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Titles -->
  <text x="76" y="38" class="k-about">WHO I AM AND WHAT I BUILD</text>
  <text x="76" y="62" class="t-about">About Me</text>
</svg>
