<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 78" width="860" height="78"
     role="img" aria-label="Contribution Snake">
  <title>Contribution Snake</title>
  <defs>
    <linearGradient id="bg-snake" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00FF66" stop-opacity="0.2"/>
      <stop offset="55%"  stop-color="#050a07" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#050a07" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule-snake" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00FF66"/>
      <stop offset="60%"  stop-color="#00FF66" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="badge-snake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#00FF66" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="soft-snake" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t-snake { font-family:"Segoe UI",Inter,Helvetica,Arial,sans-serif;
                   font-size:27px; font-weight:800; fill:#ffffff; letter-spacing:-0.2px; }
      .k-snake { font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
                   font-size:11px; font-weight:600; fill:#00FF66;
                   fill-opacity:0.85; letter-spacing:2px; }
    </style>
  </defs>

  <rect width="860" height="78" fill="url(#bg-snake)"/>

  <!-- Accent Rule -->
  <rect x="0" y="74" width="860" height="2" fill="url(#rule-snake)"/>

  <!-- Glyph Box -->
  <rect x="18" y="16" width="44" height="44" rx="10" fill="url(#badge-snake)"
        stroke="#00FF66" stroke-opacity="0.5" stroke-width="1.2"/>
  <g transform="translate(28 26)" color="#00FF66" filter="url(#soft-snake)">
    <rect x="2.4" y="9.6" width="4.6" height="4.6" rx="1.2" fill="currentColor" opacity="0.4"/><rect x="8.2" y="9.6" width="4.6" height="4.6" rx="1.2" fill="currentColor" opacity="0.7"/><rect x="14" y="9.6" width="4.6" height="4.6" rx="1.2" fill="currentColor"/><circle cx="21.2" cy="11.9" r="1.5" fill="currentColor"/>
  </g>

  <!-- Titles -->
  <text x="76" y="38" class="k-snake">WATCH IT EAT A YEAR OF COMMITS</text>
  <text x="76" y="62" class="t-snake">Contribution Snake</text>
</svg>
