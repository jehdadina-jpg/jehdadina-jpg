<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 78" width="860" height="78"
     role="img" aria-label="App Development · AR / VR">
  <title>App Development · AR / VR</title>
  <defs>
    <linearGradient id="bg-apps" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00FF88" stop-opacity="0.2"/>
      <stop offset="55%"  stop-color="#050a07" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#050a07" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule-apps" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00FF88"/>
      <stop offset="60%"  stop-color="#00FF88" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="badge-apps" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#00FF88" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="soft-apps" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t-apps { font-family:"Segoe UI",Inter,Helvetica,Arial,sans-serif;
                   font-size:27px; font-weight:800; fill:#ffffff; letter-spacing:-0.2px; }
      .k-apps { font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
                   font-size:11px; font-weight:600; fill:#00FF88;
                   fill-opacity:0.85; letter-spacing:2px; }
    </style>
  </defs>

  <rect width="860" height="78" fill="url(#bg-apps)"/>

  <!-- Accent Rule -->
  <rect x="0" y="74" width="860" height="2" fill="url(#rule-apps)"/>

  <!-- Glyph Box -->
  <rect x="18" y="16" width="44" height="44" rx="10" fill="url(#badge-apps)"
        stroke="#00FF88" stroke-opacity="0.5" stroke-width="1.2"/>
  <g transform="translate(28 26)" color="#00FF88" filter="url(#soft-apps)">
    <rect x="3" y="2.6" width="11" height="18.8" rx="2.4" fill="none" stroke="currentColor" stroke-width="2"/><line x1="6.6" y1="18.4" x2="10.4" y2="18.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16.4 8.6h3.4a2 2 0 0 1 2 2v3.6a2 2 0 0 1-2 2h-1l-1.4 2-1.4-2h-.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Titles -->
  <text x="76" y="38" class="k-apps">NATIVE, CROSS-PLATFORM, IMMERSIVE</text>
  <text x="76" y="62" class="t-apps">App Development · AR / VR</text>
</svg>
