<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 424 208" width="424" height="208"
     role="img" aria-label="PayRozgar — HTML project">
  <title>PayRozgar</title>
  <defs>
    <linearGradient id="bg-payrozgar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a07"/><stop offset="100%" stop-color="#0a150e"/>
    </linearGradient>
    <linearGradient id="top-payrozgar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FFB800" stop-opacity="0.05"/>
    </linearGradient>
    <style>
      .t-payrozgar { font-family:"Segoe UI",Inter,Helvetica,sans-serif; font-size:17px;
                   font-weight:700; fill:#ffffff; }
      .g-payrozgar { font-family:"JetBrains Mono",Consolas,monospace; font-size:10.5px;
                   fill:#FFB800; letter-spacing:0.6px; }
      .d-payrozgar { font-family:"Segoe UI",Inter,Helvetica,sans-serif; font-size:12.5px;
                   fill:#629E75; }
      .c-payrozgar { font-family:"JetBrains Mono",Consolas,monospace; font-size:10px;
                   font-weight:600; fill:#FFB800; }
      .s-payrozgar { font-family:"JetBrains Mono",Consolas,monospace; font-size:12.5px;
                   font-weight:700; fill:#FFB800; }
      .l-payrozgar { font-family:"JetBrains Mono",Consolas,monospace; font-size:9.5px;
                   font-weight:700; fill:#00FF66; letter-spacing:1.2px; }
    </style>
  </defs>

  <rect width="424" height="208" rx="14" fill="url(#bg-payrozgar)"/>
  <rect x="1" y="1" width="422" height="206" rx="13" fill="none"
        stroke="#FFB800" stroke-opacity="0.45" stroke-width="1.8"/>

  <!-- Top Accent Bar -->
  <rect x="1" y="1" width="422" height="3" rx="1.5" fill="url(#top-payrozgar)"/>

  <!-- Title & Language Dot -->
  <circle cx="34" cy="38" r="6" fill="#FFB800"/>
  <text x="50" y="43" class="t-payrozgar">PayRozgar</text>
  <text x="50" y="62" class="g-payrozgar">HTML</text>


    <text x="26" y="112" class="d-payrozgar">Offline-first payroll &amp; attendance PWA for small shops —</text>
    <text x="26" y="130" class="d-payrozgar">vanilla JS state engine, service-worker caching, and</text>
    <text x="26" y="148" class="d-payrozgar">auto-generated digital payslips. Built under FTC KJSSE.</text>
    <rect x="26" y="166" width="40" height="22" rx="11" fill="#FFB800" fill-opacity="0.12" stroke="#FFB800" stroke-opacity="0.45"/>
    <text x="46" y="181" class="c-payrozgar" text-anchor="middle">PWA</text>    <rect x="73.8" y="166" width="86" height="22" rx="11" fill="#FFB800" fill-opacity="0.12" stroke="#FFB800" stroke-opacity="0.45"/>
    <text x="117" y="181" class="c-payrozgar" text-anchor="middle">Vanilla JS</text>    <rect x="167.8" y="166" width="66" height="22" rx="11" fill="#FFB800" fill-opacity="0.12" stroke="#FFB800" stroke-opacity="0.45"/>
    <text x="201" y="181" class="c-payrozgar" text-anchor="middle">FinTech</text>

</svg>
