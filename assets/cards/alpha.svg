<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 424 208" width="424" height="208"
     role="img" aria-label="Alpha — Python project">
  <title>Alpha</title>
  <defs>
    <linearGradient id="bg-alpha" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a07"/><stop offset="100%" stop-color="#0a150e"/>
    </linearGradient>
    <linearGradient id="top-alpha" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#FF8C42" stop-opacity="0.05"/>
    </linearGradient>
    <style>
      .t-alpha { font-family:"Segoe UI",Inter,Helvetica,sans-serif; font-size:17px;
                   font-weight:700; fill:#ffffff; }
      .g-alpha { font-family:"JetBrains Mono",Consolas,monospace; font-size:10.5px;
                   fill:#FF8C42; letter-spacing:0.6px; }
      .d-alpha { font-family:"Segoe UI",Inter,Helvetica,sans-serif; font-size:12.5px;
                   fill:#629E75; }
      .c-alpha { font-family:"JetBrains Mono",Consolas,monospace; font-size:10px;
                   font-weight:600; fill:#FF8C42; }
      .s-alpha { font-family:"JetBrains Mono",Consolas,monospace; font-size:12.5px;
                   font-weight:700; fill:#FFB800; }
      .l-alpha { font-family:"JetBrains Mono",Consolas,monospace; font-size:9.5px;
                   font-weight:700; fill:#00FF66; letter-spacing:1.2px; }
    </style>
  </defs>

  <rect width="424" height="208" rx="14" fill="url(#bg-alpha)"/>
  <rect x="1" y="1" width="422" height="206" rx="13" fill="none"
        stroke="#FF8C42" stroke-opacity="0.45" stroke-width="1.8"/>

  <!-- Top Accent Bar -->
  <rect x="1" y="1" width="422" height="3" rx="1.5" fill="url(#top-alpha)"/>

  <!-- Title & Language Dot -->
  <circle cx="34" cy="38" r="6" fill="#FF8C42"/>
  <text x="50" y="43" class="t-alpha">Alpha</text>
  <text x="50" y="62" class="g-alpha">PYTHON</text>


    <text x="26" y="112" class="d-alpha">Terminal-style dashboard for NSE stocks — a cointegrated</text>
    <text x="26" y="130" class="d-alpha">pairs scanner, realized volatility term structure, and a</text>
    <text x="26" y="148" class="d-alpha">factor exposure grid, built on FastAPI and yfinance.</text>
    <rect x="26" y="166" width="66" height="22" rx="11" fill="#FF8C42" fill-opacity="0.12" stroke="#FF8C42" stroke-opacity="0.45"/>
    <text x="59" y="181" class="c-alpha" text-anchor="middle">FastAPI</text>    <rect x="100.19999999999999" y="166" width="53" height="22" rx="11" fill="#FF8C42" fill-opacity="0.12" stroke="#FF8C42" stroke-opacity="0.45"/>
    <text x="127" y="181" class="c-alpha" text-anchor="middle">Quant</text>    <rect x="161.2" y="166" width="60" height="22" rx="11" fill="#FF8C42" fill-opacity="0.12" stroke="#FF8C42" stroke-opacity="0.45"/>
