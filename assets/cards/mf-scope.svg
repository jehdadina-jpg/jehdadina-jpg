<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 424 208" width="424" height="208"
     role="img" aria-label="MF Scope — Python project">
  <title>MF Scope</title>
  <defs>
    <linearGradient id="bg-mf-scope" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a07"/><stop offset="100%" stop-color="#0a150e"/>
    </linearGradient>
    <linearGradient id="top-mf-scope" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FF66"/>
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0.05"/>
    </linearGradient>
    <style>
      .t-mf-scope { font-family:"Segoe UI",Inter,Helvetica,sans-serif; font-size:17px;
                   font-weight:700; fill:#ffffff; }
      .g-mf-scope { font-family:"JetBrains Mono",Consolas,monospace; font-size:10.5px;
                   fill:#00FF66; letter-spacing:0.6px; }
      .d-mf-scope { font-family:"Segoe UI",Inter,Helvetica,sans-serif; font-size:12.5px;
                   fill:#629E75; }
      .c-mf-scope { font-family:"JetBrains Mono",Consolas,monospace; font-size:10px;
                   font-weight:600; fill:#00FF66; }
      .s-mf-scope { font-family:"JetBrains Mono",Consolas,monospace; font-size:12.5px;
                   font-weight:700; fill:#FFB800; }
      .l-mf-scope { font-family:"JetBrains Mono",Consolas,monospace; font-size:9.5px;
                   font-weight:700; fill:#00FF66; letter-spacing:1.2px; }
    </style>
  </defs>

  <rect width="424" height="208" rx="14" fill="url(#bg-mf-scope)"/>
  <rect x="1" y="1" width="422" height="206" rx="13" fill="none"
        stroke="#00FF66" stroke-opacity="0.45" stroke-width="1.8"/>

  <!-- Top Accent Bar -->
  <rect x="1" y="1" width="422" height="3" rx="1.5" fill="url(#top-mf-scope)"/>

  <!-- Title & Language Dot -->
  <circle cx="34" cy="38" r="6" fill="#00FF66"/>
  <text x="50" y="43" class="t-mf-scope">MF Scope</text>
  <text x="50" y="62" class="g-mf-scope">PYTHON</text>


    <text x="26" y="112" class="d-mf-scope">Comprehensive mutual fund analysis platform for the</text>
    <text x="26" y="130" class="d-mf-scope">Indian market — data-driven insights for investment</text>
    <text x="26" y="148" class="d-mf-scope">research and financial decision-making.</text>
    <rect x="26" y="166" width="66" height="22" rx="11" fill="#00FF66" fill-opacity="0.12" stroke="#00FF66" stroke-opacity="0.45"/>
    <text x="59" y="181" class="c-mf-scope" text-anchor="middle">Finance</text>    <rect x="100.19999999999999" y="166" width="106" height="22" rx="11" fill="#00FF66" fill-opacity="0.12" stroke="#00FF66" stroke-opacity="0.45"/>
