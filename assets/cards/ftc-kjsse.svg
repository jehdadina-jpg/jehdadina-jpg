<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 424 208" width="424" height="208"
     role="img" aria-label="FTC KJSSE — Web project">
  <title>FTC KJSSE</title>
  <defs>
    <linearGradient id="bg-ftc-kjsse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a07"/><stop offset="100%" stop-color="#0a150e"/>
    </linearGradient>
    <linearGradient id="top-ftc-kjsse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.05"/>
    </linearGradient>
    <style>
      .t-ftc-kjsse { font-family:"Segoe UI",Inter,Helvetica,sans-serif; font-size:17px;
                   font-weight:700; fill:#ffffff; }
      .g-ftc-kjsse { font-family:"JetBrains Mono",Consolas,monospace; font-size:10.5px;
                   fill:#A78BFA; letter-spacing:0.6px; }
      .d-ftc-kjsse { font-family:"Segoe UI",Inter,Helvetica,sans-serif; font-size:12.5px;
                   fill:#629E75; }
      .c-ftc-kjsse { font-family:"JetBrains Mono",Consolas,monospace; font-size:10px;
                   font-weight:600; fill:#A78BFA; }
      .s-ftc-kjsse { font-family:"JetBrains Mono",Consolas,monospace; font-size:12.5px;
                   font-weight:700; fill:#FFB800; }
      .l-ftc-kjsse { font-family:"JetBrains Mono",Consolas,monospace; font-size:9.5px;
                   font-weight:700; fill:#00FF66; letter-spacing:1.2px; }
    </style>
  </defs>

  <rect width="424" height="208" rx="14" fill="url(#bg-ftc-kjsse)"/>
  <rect x="1" y="1" width="422" height="206" rx="13" fill="none"
        stroke="#A78BFA" stroke-opacity="0.45" stroke-width="1.8"/>

  <!-- Top Accent Bar -->
  <rect x="1" y="1" width="422" height="3" rx="1.5" fill="url(#top-ftc-kjsse)"/>

  <!-- Title & Language Dot -->
  <circle cx="34" cy="38" r="6" fill="#A78BFA"/>
  <text x="50" y="43" class="t-ftc-kjsse">FTC KJSSE</text>
  <text x="50" y="62" class="g-ftc-kjsse">WEBSITE</text>


    <text x="26" y="112" class="d-ftc-kjsse">Official website for the Finance &amp; Technology Club</text>
    <text x="26" y="130" class="d-ftc-kjsse">at KJSSE — the club I founded. Built and maintained</text>
    <text x="26" y="148" class="d-ftc-kjsse">end-to-end, from design system to deployment.</text>
    <rect x="26" y="166" width="46" height="22" rx="11" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.45"/>
    <text x="49" y="181" class="c-ftc-kjsse" text-anchor="middle">Web</text>    <rect x="80.8" y="166" width="46" height="22" rx="11" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.45"/>
    <text x="104" y="181" class="c-ftc-kjsse" text-anchor="middle">Club</text>

</svg>
