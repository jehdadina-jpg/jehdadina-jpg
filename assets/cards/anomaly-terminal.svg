<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 424 208" width="424" height="208"
     role="img" aria-label="Anomaly Terminal — Python project">
  <title>Anomaly Terminal</title>
  <defs>
    <linearGradient id="bg-anomaly-terminal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a07"/><stop offset="100%" stop-color="#0a150e"/>
    </linearGradient>
    <linearGradient id="top-anomaly-terminal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.05"/>
    </linearGradient>
    <style>
      .t-anomaly-terminal { font-family:"Segoe UI",Inter,Helvetica,sans-serif; font-size:17px;
                   font-weight:700; fill:#ffffff; }
      .g-anomaly-terminal { font-family:"JetBrains Mono",Consolas,monospace; font-size:10.5px;
                   fill:#00F0FF; letter-spacing:0.6px; }
      .d-anomaly-terminal { font-family:"Segoe UI",Inter,Helvetica,sans-serif; font-size:12.5px;
                   fill:#629E75; }
      .c-anomaly-terminal { font-family:"JetBrains Mono",Consolas,monospace; font-size:10px;
                   font-weight:600; fill:#00F0FF; }
      .s-anomaly-terminal { font-family:"JetBrains Mono",Consolas,monospace; font-size:12.5px;
                   font-weight:700; fill:#FFB800; }
      .l-anomaly-terminal { font-family:"JetBrains Mono",Consolas,monospace; font-size:9.5px;
                   font-weight:700; fill:#00FF66; letter-spacing:1.2px; }
    </style>
  </defs>

  <rect width="424" height="208" rx="14" fill="url(#bg-anomaly-terminal)"/>
  <rect x="1" y="1" width="422" height="206" rx="13" fill="none"
        stroke="#00F0FF" stroke-opacity="0.45" stroke-width="1.8"/>

  <!-- Top Accent Bar -->
  <rect x="1" y="1" width="422" height="3" rx="1.5" fill="url(#top-anomaly-terminal)"/>

  <!-- Title & Language Dot -->
  <circle cx="34" cy="38" r="6" fill="#00F0FF"/>
  <text x="50" y="43" class="t-anomaly-terminal">Anomaly Terminal</text>
  <text x="50" y="62" class="g-anomaly-terminal">PYTHON</text>

  <path d="M350 30 l3.2 6.6 7.2 1-5.2 5.1 1.2 7.2-6.4-3.4-6.4 3.4 1.2-7.2-5.2-5.1 7.2-1z" fill="#FFB800" opacity="0.95"/>
  <text x="398" y="42" class="s-anomaly-terminal" text-anchor="end">8</text>
    <text x="26" y="112" class="d-anomaly-terminal">Bloomberg-inspired stock market analysis platform</text>
    <text x="26" y="130" class="d-anomaly-terminal">combining technical analysis with ML to detect unusual</text>
    <text x="26" y="148" class="d-anomaly-terminal">market behavior and generate AI-powered Buy, Hold, and</text>
    <text x="26" y="166" class="d-anomaly-terminal">Sell recommendations.</text>
    <rect x="26" y="166" width="33" height="22" rx="11" fill="#00F0FF" fill-opacity="0.12" stroke="#00F0FF" stroke-opacity="0.45"/>
    <text x="43" y="181" class="c-anomaly-terminal" text-anchor="middle">ML</text>    <rect x="67.2" y="166" width="66" height="22" rx="11" fill="#00F0FF" fill-opacity="0.12" stroke="#00F0FF" stroke-opacity="0.45"/>
    <text x="100" y="181" class="c-anomaly-terminal" text-anchor="middle">Finance</text>

</svg>
