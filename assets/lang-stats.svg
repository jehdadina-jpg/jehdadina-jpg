<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300"
     role="img" aria-label="Language mix across 12 public repositories">
  <title>Language mix — 12 public repos, 8 languages</title>
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b28"/>
    </linearGradient>
    <linearGradient id="lac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6929C4"/><stop offset="50%" stop-color="#1F6FEB"/>
      <stop offset="100%" stop-color="#00D4AA"/>
    </linearGradient>
    <style>
      .ttl { font-family:"Segoe UI",Inter,Helvetica,sans-serif; font-size:16px;
              font-weight:700; fill:#7EE7C7; }
      .lg  { font-family:"Segoe UI",Inter,Helvetica,sans-serif; font-size:12.5px; fill:#C9D1D9; }
      .pc  { font-family:"JetBrains Mono",Consolas,monospace; font-size:12px; fill:#8B949E; }
      .kv  { font-family:"JetBrains Mono",Consolas,monospace; font-size:19px;
              font-weight:700; fill:#79C0FF; }
      .kl  { font-family:"Segoe UI",Inter,Helvetica,sans-serif; font-size:10px;
              fill:#6E7A91; letter-spacing:1.1px; }
      .tl  { font-family:"JetBrains Mono",Consolas,monospace; font-size:15px;
              font-weight:700; fill:#79C0FF; }
    </style>
  </defs>

  <rect width="520" height="300" rx="12" fill="url(#lbg)"/>
  <rect x="1" y="1" width="518" height="298" rx="11" fill="none"
        stroke="url(#lac)" stroke-opacity="0.4" stroke-width="2"/>

  <text x="22" y="34" class="ttl">◈ Language Mix</text>
  <text x="22" y="56" class="pc">12 public repos · each weighted equally</text>

    <rect x="22.0" y="74" width="139.9" height="16" rx="4" fill="#F1E05A">
      <animate attributeName="height" values="0;16" dur="0.7s" begin="0.00s" fill="freeze"/>
      <animate attributeName="y" values="90;74" dur="0.7s" begin="0.00s" fill="freeze"/>
    </rect>
    <rect x="161.9" y="74" width="126.8" height="16" fill="#3572A5">
      <animate attributeName="height" values="0;16" dur="0.7s" begin="0.07s" fill="freeze"/>
      <animate attributeName="y" values="90;74" dur="0.7s" begin="0.07s" fill="freeze"/>
    </rect>
    <rect x="288.6" y="74" width="104.9" height="16" fill="#E34C26">
      <animate attributeName="height" values="0;16" dur="0.7s" begin="0.14s" fill="freeze"/>
      <animate attributeName="y" values="90;74" dur="0.7s" begin="0.14s" fill="freeze"/>
    </rect>
    <rect x="393.5" y="74" width="52.6" height="16" fill="#3178C6">
      <animate attributeName="height" values="0;16" dur="0.7s" begin="0.21s" fill="freeze"/>
      <animate attributeName="y" values="90;74" dur="0.7s" begin="0.21s" fill="freeze"/>
    </rect>
    <rect x="446.1" y="74" width="51.6" height="16" fill="#563D7C">
      <animate attributeName="height" values="0;16" dur="0.7s" begin="0.28s" fill="freeze"/>
      <animate attributeName="y" values="90;74" dur="0.7s" begin="0.28s" fill="freeze"/>
    </rect>
    <rect x="497.7" y="74" width="1.5" height="16" fill="#C1F12E">
      <animate attributeName="height" values="0;16" dur="0.7s" begin="0.35s" fill="freeze"/>
      <animate attributeName="y" values="90;74" dur="0.7s" begin="0.35s" fill="freeze"/>
    </rect>
    <rect x="499.2" y="74" width="1.5" height="16" fill="#6E7681">
      <animate attributeName="height" values="0;16" dur="0.7s" begin="0.42s" fill="freeze"/>
      <animate attributeName="y" values="90;74" dur="0.7s" begin="0.42s" fill="freeze"/>
    </rect>
    <rect x="500.7" y="74" width="1.5" height="16" rx="4" fill="#7E858D">
      <animate attributeName="height" values="0;16" dur="0.7s" begin="0.49s" fill="freeze"/>
      <animate attributeName="y" values="90;74" dur="0.7s" begin="0.49s" fill="freeze"/>
    </rect>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.25s" fill="freeze"/>
      <circle cx="27" cy="120" r="5.5" fill="#F1E05A"/>
      <text x="40" y="124" class="lg">JavaScript</text>
      <text x="240" y="124" class="pc" text-anchor="end">29.4%</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.31s" fill="freeze"/>
      <circle cx="277" cy="120" r="5.5" fill="#3572A5"/>
      <text x="290" y="124" class="lg">Python</text>
      <text x="490" y="124" class="pc" text-anchor="end">26.6%</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.37s" fill="freeze"/>
      <circle cx="27" cy="146" r="5.5" fill="#E34C26"/>
      <text x="40" y="150" class="lg">HTML</text>
      <text x="240" y="150" class="pc" text-anchor="end">22.0%</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.43s" fill="freeze"/>
      <circle cx="277" cy="146" r="5.5" fill="#3178C6"/>
      <text x="290" y="150" class="lg">TypeScript</text>
      <text x="490" y="150" class="pc" text-anchor="end">11.0%</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.49s" fill="freeze"/>
      <circle cx="27" cy="172" r="5.5" fill="#563D7C"/>
      <text x="40" y="176" class="lg">CSS</text>
      <text x="240" y="176" class="pc" text-anchor="end">10.8%</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.55s" fill="freeze"/>
      <circle cx="277" cy="172" r="5.5" fill="#C1F12E"/>
      <text x="290" y="176" class="lg">Batchfile</text>
      <text x="490" y="176" class="pc" text-anchor="end">0.0%</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.61s" fill="freeze"/>
      <circle cx="27" cy="198" r="5.5" fill="#6E7681"/>
      <text x="40" y="202" class="lg">Procfile</text>
      <text x="240" y="202" class="pc" text-anchor="end">0.0%</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.67s" fill="freeze"/>
      <circle cx="277" cy="198" r="5.5" fill="#7E858D"/>
      <text x="290" y="202" class="lg">Mako</text>
      <text x="490" y="202" class="pc" text-anchor="end">0.0%</text>
    </g>

  <line x1="22" y1="236" x2="498" y2="236" stroke="#30363D" stroke-width="1"/>
  <g>
    <text x="60"  y="266" class="kv" text-anchor="middle">12</text>
    <text x="60"  y="282" class="kl" text-anchor="middle">REPOS</text>
    <text x="200" y="266" class="kv" text-anchor="middle">8</text>
    <text x="200" y="282" class="kl" text-anchor="middle">LANGUAGES</text>
    <text x="340" y="266" class="kv" text-anchor="middle">12</text>
    <text x="340" y="282" class="kl" text-anchor="middle">STARS</text>
    <text x="460" y="264" class="tl" text-anchor="middle">JavaScript</text>
    <text x="460" y="282" class="kl" text-anchor="middle">MOST USED</text>
  </g>
</svg>
