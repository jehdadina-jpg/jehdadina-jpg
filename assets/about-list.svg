<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 682" width="860" height="682"
     role="img" aria-label="about-list">
  <defs>
    <linearGradient id="bgabout-list" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b28"/>
    </linearGradient>
    <linearGradient id="acabout-list" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6929C4"/><stop offset="50%" stop-color="#1F6FEB"/>
      <stop offset="100%" stop-color="#00D4AA"/>
    </linearGradient>
  </defs>
  <rect width="860" height="682" rx="13" fill="url(#bgabout-list)"/>
  <rect x="1" y="1" width="858" height="680" rx="12" fill="none"
        stroke="url(#acabout-list)" stroke-opacity="0.4" stroke-width="2"/>
  <text x="26" y="36" style="font:700 16px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#7EE7C7">◈ A bit more</text><text x="834" y="36" text-anchor="end" style="font:600 10px 'JetBrains Mono','SFMono-Regular',Consolas,monospace;fill:#6E7A91;letter-spacing:1.6px">WHAT I ACTUALLY DO</text><line x1="26" y1="46" x2="834" y2="46" stroke="#30363D"/>
  <rect x="16" y="42" width="828" height="66" rx="8" fill="#ffffff" fill-opacity="0.028"/><rect x="26" y="48" width="3" height="50" rx="1.5" fill="#79C0FF"/><circle cx="27.5" cy="57" r="4.5" fill="#79C0FF"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.00s" repeatCount="indefinite"/></circle><text x="46" y="62" style="font:700 14px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ffffff">Computer Engineering Student at KJSSE</text>
  <text x="46" y="84" style="font:400 12.5px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8B949E">Building AI/ML and FinTech systems while maintaining a SGPA of 9.04. Focus on practical applications that solve</text>
  <text x="46" y="101" style="font:400 12.5px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8B949E">real problems.</text>
  <rect x="16" y="114" width="828" height="66" rx="8" fill="#ffffff" fill-opacity="0.008"/><rect x="26" y="120" width="3" height="50" rx="1.5" fill="#7EE7C7"/><circle cx="27.5" cy="129" r="4.5" fill="#7EE7C7"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.25s" repeatCount="indefinite"/></circle><text x="46" y="134" style="font:700 14px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ffffff">AI &amp; Machine Learning Engineering</text>
  <text x="46" y="156" style="font:400 12.5px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8B949E">Building ML models for financial markets, anomaly detection, and predictive analytics. NLP systems for voice</text>
  <text x="46" y="173" style="font:400 12.5px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8B949E">assistants and regional language processing.</text>
  <rect x="16" y="186" width="828" height="66" rx="8" fill="#ffffff" fill-opacity="0.028"/><rect x="26" y="192" width="3" height="50" rx="1.5" fill="#B191FF"/><circle cx="27.5" cy="201" r="4.5" fill="#B191FF"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.50s" repeatCount="indefinite"/></circle><text x="46" y="206" style="font:700 14px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ffffff">FinTech Development</text>
  <text x="46" y="228" style="font:400 12.5px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8B949E">Creating practical financial tools — mutual fund analysis platforms, payroll management systems, and market</text>
  <text x="46" y="245" style="font:400 12.5px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8B949E">intelligence dashboards for real-world use.</text>
  <rect x="16" y="258" width="828" height="66" rx="8" fill="#ffffff" fill-opacity="0.008"/><rect x="26" y="264" width="3" height="50" rx="1.5" fill="#FF7B72"/><circle cx="27.5" cy="273" r="4.5" fill="#FF7B72"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.75s" repeatCount="indefinite"/></circle><text x="46" y="278" style="font:700 14px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ffffff">Full Stack Development</text>
  <text x="46" y="300" style="font:400 12.5px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8B949E">React and Next.js frontends, Node.js and Flask backends, PostgreSQL and Supabase databases. Complete end-to-end</text>
  <text x="46" y="317" style="font:400 12.5px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8B949E">applications deployed to production.</text>
  <rect x="16" y="330" width="828" height="66" rx="8" fill="#ffffff" fill-opacity="0.028"/><rect x="26" y="336" width="3" height="50" rx="1.5" fill="#F0A868"/><circle cx="27.5" cy="345" r="4.5" fill="#F0A868"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.00s" repeatCount="indefinite"/></circle><text x="46" y="350" style="font:700 14px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ffffff">Agentic AI &amp; LLM Integration</text>
  <text x="46" y="372" style="font:400 12.5px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8B949E">Implementing LLM-powered agents using OpenAI, Claude, and custom workflows. Real research agents and intelligent</text>
  <text x="46" y="389" style="font:400 12.5px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8B949E">automation systems.</text>
  <rect x="16" y="402" width="828" height="66" rx="8" fill="#ffffff" fill-opacity="0.008"/><rect x="26" y="408" width="3" height="50" rx="1.5" fill="#F0A868"/><circle cx="27.5" cy="417" r="4.5" fill="#F0A868"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.25s" repeatCount="indefinite"/></circle><text x="46" y="422" style="font:700 14px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ffffff">Leadership &amp; Community Building</text>
  <text x="46" y="444" style="font:400 12.5px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8B949E">Founded Finance &amp; Technology Club at KJSSE. Organized FinovateX 2026 — a 7-hour FinTech dual-event. Contributing</text>
  <text x="46" y="461" style="font:400 12.5px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8B949E">to fintech research and discourse.</text>
  <rect x="16" y="474" width="828" height="66" rx="8" fill="#ffffff" fill-opacity="0.028"/><rect x="26" y="480" width="3" height="50" rx="1.5" fill="#A5D6FF"/><circle cx="27.5" cy="489" r="4.5" fill="#A5D6FF"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.50s" repeatCount="indefinite"/></circle><text x="46" y="494" style="font:700 14px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ffffff">Industry Experience</text>
  <text x="46" y="516" style="font:400 12.5px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8B949E">Intern at Rayze Technologies (Founders Office), TÜV Rheinland India (Industrial Services &amp; Cyber Security).</text>
  <text x="46" y="533" style="font:400 12.5px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8B949E">Real-world exposure to product and security.</text>
  <rect x="16" y="546" width="828" height="66" rx="8" fill="#ffffff" fill-opacity="0.008"/><rect x="26" y="552" width="3" height="50" rx="1.5" fill="#7EE7C7"/><circle cx="27.5" cy="561" r="4.5" fill="#7EE7C7"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.75s" repeatCount="indefinite"/></circle><text x="46" y="566" style="font:700 14px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ffffff">Open to Collaboration</text>
  <text x="46" y="588" style="font:400 12.5px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8B949E">Interested in AI/ML projects, FinTech innovation, and building impactful systems. Available for internships and</text>
  <text x="46" y="605" style="font:400 12.5px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8B949E">interesting projects.</text>
  <line x1="26" y1="640" x2="834" y2="640" stroke="#30363D"/><text x="26" y="664" style="font:600 12.5px 'JetBrains Mono','SFMono-Regular',Consolas,monospace;fill:#7EE7C7">🌐 jehdadina.xyz</text><text x="834" y="664" text-anchor="end" style="font:400 11.5px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8B949E">Open to collaboration</text>
</svg>
